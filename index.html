<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin J Falk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <!-- Header image container (rotating banner) -->
        <div id="header-image" class="header-image"></div>

        <h1>Martin J Falk</h1>
    </header>

    <main>
        <section id="about" class="content-section"></section>
        <section id="research" class="content-section"></section>
        <section id="publications" class="content-section"></section>
    </main>

    <footer>
        <p>Last updated <span id="last-updated"></span></p>
    </footer>

    <!-- Loading indicator -->
    <div id="loading">Loading content...</div>

    <!-- Configure content source -->
    <script src="config.js"></script>
    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Main script to load content -->
    <script src="main.js"></script>
</body>
</html>
